services:
  falkordb:
    image: falkordb/falkordb:6.0.1   # 6.x image tags have no v prefix
    container_name: minutes-falkordb
    # Local development only. In a deployment keep the database on a private network: no published ports.
    ports:
      - "6379:6379"   # database
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    environment:
      - FALKORDB_ARGS=TIMEOUT_DEFAULT 3000 TIMEOUT_MAX 10000 MAX_QUEUED_QUERIES 500
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: minutes-api
    depends_on:
      falkordb:
        condition: service_healthy
    env_file: .env
    environment:
      - FALKORDB_URL=falkor://falkordb:6379
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      # The embedding model is baked into the image; these override empty values from .env.
      - HF_HOME=/app/hf-cache
      - HF_HUB_OFFLINE=1
      - EMBED_MODEL=onnx-community/embeddinggemma-300m-ONNX
    ports:
      - "8080:8000"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: minutes-web
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  falkordb_data:

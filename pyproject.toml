[project]
name = "minutes-workspace"
version = "0.1.0"
description = "Minutes: shared, time-aware memory for agent teams on FalkorDB (Graph Hacks 2026)"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv.workspace]
members = ["packages/hiveboard", "packages/ingest", "apps/api"]

[tool.uv.sources]
hiveboard = { workspace = true }
ingest = { workspace = true }

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/hiveboard/tests", "packages/ingest/tests", "apps/api/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

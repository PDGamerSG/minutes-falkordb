[project]
name = "hiveboard"
version = "0.1.0"
description = "Hive Board: shared, time-aware graph memory substrate for agent teams on FalkorDB"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "falkordb>=1.2",
  "redis>=5.0",
  "pydantic>=2",
  "mcp>=1.2",
  "orjson>=3.9",
]

[project.scripts]
hiveboard-mcp = "hiveboard.mcp_server:main"
hiveboard-bench = "bench.harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hiveboard", "bench"]

# Wheels carry a copy of the repo's cypher/ folder so installed (non-checkout) deployments find the queries.
# The checkout's cypher/ folder stays the single source of truth; hiveboard.queries prefers it when present.
[tool.hatch.build.targets.wheel.force-include]
"../../cypher" = "hiveboard/cypher"

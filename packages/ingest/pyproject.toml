[project]
name = "ingest"
version = "0.1.0"
description = "Minutes ingestion: recorder exports and email threads -> episodes -> facts, decisions, commitments"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.8",
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "huggingface-hub>=0.24",
  "python-dateutil>=2.9",
  "google-genai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]
